[pytest]
# tests/ only: the benchmark tree is collected by passing it explicitly
# (`pytest benchmark ...`), because its options -- --level above all -- are
# declared in benchmark/conftest.py and pytest resolves the command line before
# it collects anything, so a conftest that is not loaded cannot declare them.
# FlagGems has the same layout and the same requirement; see the benchmark
# commands in docs/development.md.
testpaths = tests
pythonpath = src
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    ignore::DeprecationWarning
    ignore:Warning only once for all operators,  other operators may also be .*:UserWarning
markers =
    median: Median operator tests
